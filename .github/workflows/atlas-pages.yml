name: GitHub Star Atlas Pages
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: '重新采集数据（关闭则发布已有快照）'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atlas-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: |
          python -m unittest discover -s atlas-service/tests
          node --test atlas-service/tests/frontend.test.mjs
      - name: Collect complete snapshot
        if: github.event_name == 'schedule' || inputs.refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python atlas-service/scripts/collect.py --force --output atlas-service/data/latest.json
      - name: Validate and build public artifact
        run: python atlas-service/scripts/build.py
      - name: Commit public data history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-service/data/latest.json atlas-service/data/history
          if ! git diff --cached --quiet; then
            git commit -m 'Update Atlas public snapshot'
            git push
          fi
      - name: Stage dereferenced static artifact
        run: cp -RL atlas-service/dist atlas-pages-public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-pages-public/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
